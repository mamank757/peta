name: Update Wind Grid Data (ECMWF IFS 9 km)

on:
  schedule:
    # 2x sehari (setelah run ECMWF 00Z & 12Z tersedia). Tiap eksekusi ~3.400 panggilan API;
    # batas gratis Open-Meteo 10.000/hari, jadi JANGAN menambah frekuensi tanpa mengecilkan grid.
    - cron: '30 6,18 * * *'
  workflow_dispatch:       # eksekusi manual (hitungannya ikut kuota harian!)

permissions:
  contents: write

concurrency:
  group: update-wind
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Jalankan Script Pengolah Angin
        run: python scripts/process_wind.py

      - name: Commit dan Push Perubahan
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/wind-detail.json data/wind-regional.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data"
          else
            git commit -m "Auto-update: angin ECMWF $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
