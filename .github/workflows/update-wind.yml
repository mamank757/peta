name: Update Wind Grid Data

on:
  schedule:
    - cron: '25 * * * *'   # tiap jam (menit ke-25) agar angin selalu mendekati waktu sekarang
  workflow_dispatch:       # eksekusi manual via tombol di GitHub

permissions:
  contents: write

concurrency:
  group: update-wind
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install System Dependencies (eccodes untuk GRIB)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Jalankan Script Pengolah Angin
        run: python scripts/process_wind.py

      - name: Commit dan Push Perubahan
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/wind-sulsel.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data"
          else
            git commit -m "Auto-update: angin GFS $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
