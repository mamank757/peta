name: update-wind
on:
  schedule:
    # Berjalan setiap 6 jam (00:15, 06:15, 12:15, 18:15 UTC) menyesuaikan siklus update ECMWF
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy-wind:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          
      - name: Install dependencies
        # Sesuaikan requirements jika process_wind.py butuh library lain
        run: pip install requests numpy pandas
        
      - name: Run ECMWF Wind Processing
        run: python scripts/process_wind.py
        
      - name: Commit hasil data angin
        run: |
          git config user.name "wind-bot"
          git config user.email "wind-bot@users.noreply.github.com"
          # Menambahkan semua file JSON angin yang dihasilkan
          git add data/wind-*.json
          if ! git diff --cached --quiet; then
            git commit -m "update data angin ECMWF $(date -u +%F %H:%M)"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact untuk Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
