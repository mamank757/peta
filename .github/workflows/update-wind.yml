name: update-wind
on:
  schedule:
    # 2x sehari = 6.832 panggilan/hari (batas gratis Open-Meteo < 10.000).
    # 06:15 UTC -> memakai run IFS 00Z, 18:15 UTC -> run 12Z (data tersedia ±4-6 jam setelah inisialisasi).
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy-wind:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30          # skrip ±10 menit; sisakan ruang untuk retry 429/5xx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests numpy

      - name: Run ECMWF Wind Processing
        env:
          RUNS_PER_DAY: "2"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/process_wind.py

      - name: Commit hasil data angin
        run: |
          git config user.name "wind-bot"
          git config user.email "wind-bot@users.noreply.github.com"
          git add data/wind-*.json
          if ! git diff --cached --quiet; then
            git commit -m "update data angin ECMWF $(date -u '+%F %H:%M')"
            git pull --rebase --autostash
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact untuk Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
