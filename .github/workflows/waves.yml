name: build-waves
on:
  schedule:
    - cron: "30 3 * * *"        # harian 03:30 UTC (11:30 WITA)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy scipy pandas xarray netCDF4 pillow
      
      # TAMBAHAN PENTING: Cache file statis klimatologi (LTM) agar tidak diunduh setiap hari
      - name: Cache LTM NetCDF files
        uses: actions/cache@v4
        with:
          path: data/*.nc
          key: ltm-data-1991-2020-v1
          
      - run: python scripts/build_waves.py
      - name: Commit hasil
        run: |
          git config user.name "wave-bot"
          git config user.email "wave-bot@users.noreply.github.com"
          git add data/waves
          if ! git diff --cached --quiet; then
            git commit -m "waves $(date -u +%F)"
            git push
          fi
