name: build-waves
on:
  schedule:
    - cron: "30 3 * * *"        # harian 03:30 UTC (11:30 WITA)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy scipy pandas xarray netCDF4 pydap pillow
      - name: Bangun peta gelombang (maks 3 percobaan)
        run: |
          for i in 1 2 3; do
            python scripts/build_waves.py && exit 0
            echo "Percobaan $i gagal; ulangi dalam 120 detik"
            sleep 120
          done
          exit 1
      - name: Commit hasil
        run: |
          git config user.name "wave-bot"
          git config user.email "wave-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/waves
          if ! git diff --cached --quiet; then
            git commit -m "waves $(date -u +%F)"
            git push
          fi
