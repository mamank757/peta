name: build-waves
on:
  schedule:
    - cron: "30 3 * * *"        # harian 03:30 UTC (11:30 WITA)
  workflow_dispatch:

# Memberikan izin yang diperlukan untuk commit ke repo dan deploy ke Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Konfigurasi konkurensi agar deployment tidak bertabrakan jika di-trigger manual berdekatan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          
      - name: Install dependencies
        run: pip install numpy scipy pandas xarray netCDF4 pillow
        
      - name: Cache LTM NetCDF files
        uses: actions/cache@v4
        with:
          path: data/*.nc
          key: ltm-data-1991-2020-v1
          
      - name: Run Wave Analysis
        run: python scripts/build_waves.py
        
      - name: Commit hasil pemrosesan (Opsional)
        run: |
          git config user.name "wave-bot"
          git config user.email "wave-bot@users.noreply.github.com"
          git add data/waves
          if ! git diff --cached --quiet; then
            git commit -m "update data gelombang $(date -u +%F)"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact untuk Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Mengunggah seluruh root direktori (termasuk index.html dan folder data/)
          path: '.'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
